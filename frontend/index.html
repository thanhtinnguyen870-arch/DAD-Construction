<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>DAD Construction — Thiết Kế &amp; Thi Công Nhà Ở Trọn Gói Đà Nẵng</title>
    <meta name="description" content="DAD Construction chuyên thiết kế kiến trúc, thi công trọn gói nhà phố, biệt thự, nhà cấp 4 tại Đà Nẵng và miền Trung. Hơn 10 năm kinh nghiệm, 250+ công trình hoàn thiện, bảo hành 5 năm." />
    <meta name="keywords" content="thiết kế nhà Đà Nẵng, thi công nhà trọn gói, xây dựng nhà phố, biệt thự Đà Nẵng, DAD Construction, báo giá xây dựng" />
    <meta name="author" content="DAD Construction" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dadconstruction.vn/" />
    <meta property="og:title" content="DAD Construction — Thiết Kế &amp; Thi Công Nhà Ở Trọn Gói" />
    <meta property="og:description" content="Chuyên thiết kế, thi công nhà phố, biệt thự, nhà cấp 4 trọn gói. Báo giá minh bạch, bảo hành 5 năm." />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="DAD Construction" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <!-- Initial loader styles (outside root so React doesn't conflict) -->
    <style>
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #1A1A1A; z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #initial-loader.fade-out { opacity: 0; pointer-events: none; }
      .il-logo { width: 72px; height: 72px; object-fit: contain; margin-bottom: 20px; border-radius: 4px; }
      .il-spinner {
        width: 32px; height: 32px;
        border: 2px solid rgba(203,161,53,0.25);
        border-top: 2px solid #CBA135;
        border-radius: 50%;
        animation: ilspin 0.75s linear infinite;
        margin-bottom: 14px;
      }
      .il-text { color: rgba(255,255,255,0.4); font-size: 12px; font-family: sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
      @keyframes ilspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Initial loader sits OUTSIDE #root so React rendering doesn't conflict -->
    <div id="initial-loader">
      <img src="/logo.jpg" alt="DAD Construction" class="il-logo" />
      <div class="il-spinner"></div>
      <div class="il-text">Đang tải...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
