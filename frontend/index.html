<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>DAD Construction</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background-color: #ffffff; z-index: 9999; font-family: sans-serif;
        }
        .initial-loader-spinner {
          width: 40px; height: 40px; border: 3px solid #f3f3f3;
          border-top: 3px solid #d4af37; border-radius: 50%;
          animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div style="color: #666; font-size: 14px; font-weight: 500;">DAD Construction</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
